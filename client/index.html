<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vite App</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
  <script setup>
import { ref, onMounted, computed } from 'vue'

// 定義變數 (就像 React 的 useState)
const medicines = ref([])
const cart = ref([])
const loading = ref(true)

// 1. 畫面載入時，去後端抓資料
onMounted(async () => {
  try {
    const res = await fetch('http://localhost:3001/api/medicines')
    const data = await res.json()
    medicines.value = data
  } catch (err) {
    console.error('連線失敗:', err)
    alert('連線後端失敗，請確認 Server 有沒有開！')
  } finally {
    loading.value = false
  }
})

// 2. 加入處方功能
const addToPrescription = (medicine) => {
  if (medicine.stock_quantity <= 0) return
  
  // 簡單模擬：直接加入陣列
  cart.value.push({
    ...medicine,
    qty: 1
  })
}

// 3. 計算總金額 (Vue 的強項：computed)
const totalPrice = computed(() => {
  return cart.value.reduce((sum, item) => sum + Number(item.price_per_unit), 0)
})
</script>

<template>
  <div class="container">
    <h1>👨‍⚕️ Bema 醫師開藥系統 (Vue版)</h1>

    <div class="main-layout">
      
      <div class="panel">
        <h2>💊 藥材庫存清單</h2>
        <p v-if="loading">正在讀取資料庫...</p>
        
        <ul v-else class="list">
          <li v-for="med in medicines" :key="med.id" class="list-item">
            <div>
              <strong>{{ med.name }}</strong>
              <div class="sub-text">庫存: {{ med.stock_quantity }} {{ med.unit }} | 單價: ${{ med.price_per_unit }}</div>
            </div>
            <button 
              @click="addToPrescription(med)" 
              :disabled="med.stock_quantity <= 0"
              :class="{ 'btn-disabled': med.stock_quantity <= 0 }"
            >
              {{ med.stock_quantity > 0 ? '加入處方' : '缺貨' }}
            </button>
          </li>
        </ul>
      </div>

      <div class="panel cart-panel">
        <h2>📝 目前處方內容</h2>
        <p v-if="cart.length === 0" style="color: #666">尚未加入任何藥材...</p>
        
        <ul v-else>
          <li v-for="(item, index) in cart" :key="index" class="cart-item">
            {{ item.name }} - ${{ item.price_per_unit }}
          </li>
        </ul>

        <hr />
        <h3>總金額: ${{ totalPrice.toFixed(2) }}</h3>
        <button class="checkout-btn">送出處方單 (Checkout)</button>
      </div>

    </div>
  </div>
</template>

<style scoped>
/* 簡單的 CSS 美化 */
.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
  font-family: Arial, sans-serif;
}
.main-layout {
  display: flex;
  gap: 20px;
}
.panel {
  flex: 1;
  border: 1px solid #ddd;
  padding: 20px;
  border-radius: 8px;
}
.cart-panel {
  background-color: #f9f9f9;
  border-color: #333;
}
.list {
  list-style: none;
  padding: 0;
}
.list-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #eee;
  padding: 10px 0;
}
.sub-text {
  font-size: 0.85em;
  color: #666;
}
button {
  background-color: #42b883; /* Vue 的綠色 */
  color: white;
  border: none;
  padding: 5px 10px;
  border-radius: 4px;
  cursor: pointer;
}
.btn-disabled {
  background-color: #ccc;
  cursor: not-allowed;
}
.checkout-btn {
  width: 100%;
  padding: 10px;
  background-color: #35495e;
  margin-top: 10px;
}
.cart-item {
  margin-bottom: 5px;
}
</style>
</html>
